
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1B3F73" />
    <meta name="description" content="HRK Bio Polymers Pvt. Ltd. is an ISO-certified manufacturer and exporter of garbage bags, courier bags, shrink film, mulch film and custom polymer packaging from Gujarat, India." />
    <meta property="og:title" content="HRK Bio Polymers Pvt. Ltd. | Global Packaging Solutions" />
    <meta property="og:description" content="ISO-certified, export-ready polymer and bio-based packaging manufactured in India." />
    <meta property="og:image" content="https://www.hrk.co.in/logo.png" />
    <meta property="og:url" content="https://www.hrk.co.in/" />
    <title>HRK Bio Polymers Pvt. Ltd. | Global Packaging Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Brand colours taken from the HRK logo
              primary: { DEFAULT: '#1B3F73', dark: '#0B2D57', light: '#E8EEF7' },
              secondary: { DEFAULT: '#3DA352', dark: '#2E8A41', light: '#E9F6EC' },
              accent: '#D4A01E',
              dark: '#1A2436',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #ffffff;
      }
      .gradient-bg {
        background: linear-gradient(135deg, #0B2D57 0%, #1B3F73 55%, #2E8A41 100%);
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      .pulse-marker {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(2.5); opacity: 0; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
